name: Binance public-data transport 2026-08-15

on:
  push:
    branches:
      - agent/binance-public-data-transport-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install transport dependency
        run: python -m pip install requests==2.32.5

      - name: Download, checksum-verify and ZIP-audit official public files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transport
          cat > transport/acquire.py <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import hashlib
          import json
          import os
          import tempfile
          import time
          import zipfile
          from pathlib import Path

          import requests

          BASE = "https://data.binance.vision/data"
          ROOT = Path("transport/workspace")

          def months(start: str, end: str) -> list[str]:
              sy, sm = map(int, start.split("-"))
              ey, em = map(int, end.split("-"))
              out = []
              y, m = sy, sm
              while (y, m) <= (ey, em):
                  out.append(f"{y:04d}-{m:02d}")
                  m += 1
                  if m == 13:
                      y += 1
                      m = 1
              return out

          def plan() -> list[dict[str, str]]:
              out = []
              for ym in months("2020-01", "2026-06"):
                  specs = {
                      "spot_klines": (
                          f"{BASE}/spot/monthly/klines/BTCUSDT/1h/BTCUSDT-1h-{ym}.zip",
                          ROOT / "raw" / "spot" / f"BTCUSDT-1h-{ym}.zip",
                      ),
                      "perp_klines": (
                          f"{BASE}/futures/um/monthly/klines/BTCUSDT/1h/BTCUSDT-1h-{ym}.zip",
                          ROOT / "raw" / "perp" / f"BTCUSDT-1h-{ym}.zip",
                      ),
                      "funding": (
                          f"{BASE}/futures/um/monthly/fundingRate/BTCUSDT/BTCUSDT-fundingRate-{ym}.zip",
                          ROOT / "raw" / "funding" / f"BTCUSDT-fundingRate-{ym}.zip",
                      ),
                  }
                  for dataset, (url, path) in specs.items():
                      out.append({"dataset": dataset, "month": ym, "url": url, "path": str(path)})
              return out

          def get(url: str) -> bytes:
              last = None
              for attempt in range(6):
                  try:
                      response = requests.get(url, timeout=120)
                      response.raise_for_status()
                      return response.content
                  except Exception as exc:
                      last = exc
                      if attempt == 5:
                          break
                      time.sleep(1.5 * (2 ** attempt))
              raise RuntimeError(f"download failed: {url}: {last}")

          def atomic(path: Path, data: bytes) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              fd, tmp = tempfile.mkstemp(prefix=path.name + ".", dir=path.parent)
              try:
                  with os.fdopen(fd, "wb") as f:
                      f.write(data)
                      f.flush()
                      os.fsync(f.fileno())
                  os.replace(tmp, path)
              finally:
                  if os.path.exists(tmp):
                      os.unlink(tmp)

          def acquire(item: dict[str, str]) -> dict[str, object]:
              path = Path(item["path"])
              sidecar = get(item["url"] + ".CHECKSUM")
              text = sidecar.decode("utf-8", "strict").strip()
              parts = text.split()
              if not parts or len(parts[0]) != 64:
                  raise RuntimeError(f"invalid sidecar: {item['url']}")
              expected = parts[0].lower()
              if len(parts) >= 2 and Path(parts[-1].lstrip("*")).name != path.name:
                  raise RuntimeError(f"sidecar filename mismatch: {item['url']}")
              payload = get(item["url"])
              actual = hashlib.sha256(payload).hexdigest()
              if actual != expected:
                  raise RuntimeError(f"sha256 mismatch: {item['url']}")
              atomic(path, payload)
              atomic(Path(str(path) + ".CHECKSUM"), sidecar)
              with zipfile.ZipFile(path) as zf:
                  names = [name for name in zf.namelist() if not name.endswith("/")]
                  if len(names) != 1:
                      raise RuntimeError(f"unexpected ZIP members: {path}: {names}")
                  bad = zf.testzip()
                  if bad is not None:
                      raise RuntimeError(f"corrupt ZIP member: {path}: {bad}")
              return {
                  "dataset": item["dataset"],
                  "month": item["month"],
                  "url": item["url"],
                  "path": str(path.relative_to(ROOT)),
                  "bytes": len(payload),
                  "sha256": actual,
              }

          items = plan()
          rows = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              futures = {pool.submit(acquire, item): item for item in items}
              for future in concurrent.futures.as_completed(futures):
                  row = future.result()
                  rows.append(row)
                  print(f"OK {row['dataset']} {row['month']} {str(row['sha256'])[:12]}", flush=True)
          rows.sort(key=lambda row: (str(row["dataset"]), str(row["month"])))
          canonical = json.dumps(rows, sort_keys=True, separators=(",", ":")).encode()
          manifest = {
              "source": "official Binance Vision monthly ZIP plus CHECKSUM",
              "start_month": "2020-01",
              "end_month": "2026-06",
              "objects": len(rows),
              "manifest_identity_sha256": hashlib.sha256(canonical).hexdigest(),
              "entries": rows,
          }
          (ROOT / "transport_manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps({key: manifest[key] for key in manifest if key != "entries"}, indent=2))
          PY
          python transport/acquire.py 2>&1 | tee transport/acquire.log

      - name: Build deterministic raw-corpus bundle
        shell: bash
        run: |
          set -euo pipefail
          cp transport/acquire.log transport/workspace/
          find transport/workspace -type f -print0 | sort -z | xargs -0 sha256sum \
            > transport/workspace/TRANSPORT_SHA256SUMS.txt
          tar --sort=name --mtime='UTC 2026-08-15' --owner=0 --group=0 --numeric-owner \
            -czf transport/BINANCE_BTCUSDT_PUBLIC_CORPUS_2020_01_2026_06.tar.gz \
            -C transport/workspace .
          sha256sum transport/BINANCE_BTCUSDT_PUBLIC_CORPUS_2020_01_2026_06.tar.gz \
            > transport/BINANCE_BTCUSDT_PUBLIC_CORPUS_2020_01_2026_06.tar.gz.sha256

      - name: Upload public corpus transport artifact
        uses: actions/upload-artifact@v4
        with:
          name: BINANCE_BTCUSDT_PUBLIC_CORPUS_2020_01_2026_06
          path: |
            transport/BINANCE_BTCUSDT_PUBLIC_CORPUS_2020_01_2026_06.tar.gz
            transport/BINANCE_BTCUSDT_PUBLIC_CORPUS_2020_01_2026_06.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
